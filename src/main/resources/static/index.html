<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokédex</title>
    <style>
        :root { --red:#e3350d; --dark:#222; --bg:#f4f4f6; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: system-ui, Arial, sans-serif; background:var(--bg); color:var(--dark); }
        header { background:var(--red); color:#fff; padding:16px 24px; font-size:1.5rem; font-weight:700; }
        main { max-width:900px; margin:24px auto; padding:0 16px; }
        .card { background:#fff; border-radius:10px; padding:20px; margin-bottom:24px; box-shadow:0 2px 6px rgba(0,0,0,.1); }
        h2 { margin-top:0; }
        form { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
        label { display:flex; flex-direction:column; font-size:.85rem; gap:4px; }
        input { padding:8px; border:1px solid #ccc; border-radius:6px; font-size:1rem; }
        .actions { grid-column:1/-1; display:flex; gap:8px; }
        button { border:0; border-radius:6px; padding:9px 16px; cursor:pointer; font-size:.95rem; color:#fff; background:var(--red); }
        button.sec { background:#777; }
        button.edit { background:#2a75bb; padding:5px 10px; }
        button.del { background:#444; padding:5px 10px; }
        table { width:100%; border-collapse:collapse; }
        th, td { text-align:left; padding:8px; border-bottom:1px solid #eee; }
        th { background:#fafafa; }
        #msg { margin-bottom:12px; font-weight:600; }
        .ok { color:#1a7f37; } .err { color:#c0392b; }
        .table-wrap { overflow-x:auto; }
    </style>
</head>
<body>
<header>Pokédex</header>
<main>
    <div class="card">
        <h2 id="titulo-form">Cadastrar Pokémon</h2>
        <div id="msg"></div>
        <form id="form">
            <input type="hidden" id="codigo">
            <label>Nome <input id="nome" required></label>
            <label>Tipo <input id="tipo" required></label>
            <label>Altura (m) <input id="altura" type="number" step="0.01" min="0.01" required></label>
            <label>Peso (kg) <input id="peso" type="number" step="0.01" min="0.01" required></label>
            <label>Data de captura <input id="data" type="date"></label>
            <div class="actions">
                <button type="submit" id="btn-salvar">Salvar</button>
                <button type="button" class="sec" id="btn-cancelar" style="display:none">Cancelar</button>
            </div>
        </form>
    </div>

    <div class="card">
        <h2>Pokémons cadastrados</h2>
        <div class="table-wrap">
            <table>
                <thead><tr><th>#</th><th>Nome</th><th>Tipo</th><th>Altura</th><th>Peso</th><th>Captura</th><th></th></tr></thead>
                <tbody id="lista"><tr><td colspan="7">Carregando...</td></tr></tbody>
            </table>
        </div>
    </div>
</main>

<script>
    // Mesma origem: front e API rodam no mesmo serviço
    const API = "/pokemons";
    const $ = id => document.getElementById(id);

    function msg(texto, ok = true) {
        $("msg").className = ok ? "ok" : "err";
        $("msg").textContent = texto;
        setTimeout(() => $("msg").textContent = "", 4000);
    }

    function esc(s) {
        const d = document.createElement("div");
        d.textContent = s ?? "";
        return d.innerHTML;
    }

    async function carregar() {
        try {
            const r = await fetch(API);
            if (!r.ok) throw new Error();
            const lista = await r.json();
            $("lista").innerHTML = lista.length ? lista.map(p => `
        <tr>
          <td>${p.codigo}</td>
          <td>${esc(p.nome)}</td>
          <td>${esc(p.tipo)}</td>
          <td>${p.altura} m</td>
          <td>${p.peso} kg</td>
          <td>${p.dataDeCaptura ? p.dataDeCaptura.split("-").reverse().join("/") : "-"}</td>
          <td>
            <button class="edit" onclick="editar(${p.codigo})">Editar</button>
            <button class="del" onclick="excluir(${p.codigo})">Excluir</button>
          </td>
        </tr>`).join("") : `<tr><td colspan="7">Nenhum Pokémon cadastrado.</td></tr>`;
        } catch {
            $("lista").innerHTML = `<tr><td colspan="7" class="err">Erro ao carregar a lista.</td></tr>`;
        }
    }

    function limpar() {
        $("form").reset();
        $("codigo").value = "";
        $("titulo-form").textContent = "Cadastrar Pokémon";
        $("btn-cancelar").style.display = "none";
    }

    async function editar(codigo) {
        const r = await fetch(`${API}/${codigo}`);
        if (!r.ok) return msg("Pokémon não encontrado.", false);
        const p = await r.json();
        $("codigo").value = p.codigo;
        $("nome").value = p.nome;
        $("tipo").value = p.tipo;
        $("altura").value = p.altura;
        $("peso").value = p.peso;
        $("data").value = p.dataDeCaptura || "";
        $("titulo-form").textContent = "Editar Pokémon #" + p.codigo;
        $("btn-cancelar").style.display = "inline-block";
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function excluir(codigo) {
        if (!confirm("Excluir este Pokémon?")) return;
        const r = await fetch(`${API}/${codigo}`, { method: "DELETE" });
        if (r.ok) { msg("Pokémon excluído."); carregar(); }
        else msg("Erro ao excluir.", false);
    }

    $("form").addEventListener("submit", async e => {
        e.preventDefault();
        const codigo = $("codigo").value;
        const body = {
            nome: $("nome").value.trim(),
            tipo: $("tipo").value.trim(),
            altura: parseFloat($("altura").value),
            peso: parseFloat($("peso").value),
            dataDeCaptura: $("data").value || null
        };
        const r = await fetch(codigo ? `${API}/${codigo}` : API, {
            method: codigo ? "PUT" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        if (r.ok) {
            msg(codigo ? "Pokémon atualizado!" : "Pokémon cadastrado!");
            limpar();
            carregar();
        } else {
            msg("Erro ao salvar. Confira os campos.", false);
        }
    });

    $("btn-cancelar").addEventListener("click", limpar);
    carregar();
</script>
</body>
</html>
